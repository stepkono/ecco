<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BioSpectra: untangle noisy bioacoustic spectrograms in 3D to train TinyML models for edge sensors." />
    <title>BioSpectra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
            <path d="M2 22 Q8 6 12 18 T22 12 T30 16" fill="none" stroke="#9be15d" stroke-width="2.4" stroke-linecap="round" />
            <path d="M2 26 Q9 16 14 23 T30 22" fill="none" stroke="#56c8ff" stroke-width="2" stroke-linecap="round" opacity=".8" />
          </svg>
          <span>Bio<b>Spectra</b></span>
        </div>
        <nav id="nodes" class="nodes" aria-label="Edge nodes"></nav>
        <div class="top-actions">
          <label class="btn ghost" title="Load your own field recording (any audio file)">
            <input id="upload" type="file" accept="audio/*" hidden />
            Upload clip
          </label>
          <button id="btn-eco" class="btn ghost">Ecosystem <span id="eco-count" class="pill">0/6</span></button>
          <button id="btn-lab" class="btn primary">Edge AI Lab <span id="ds-count" class="pill">0</span></button>
        </div>
      </header>

      <aside class="tools" aria-label="Tools">
        <button class="tool" data-tool="view" title="Orbit view (V)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><ellipse cx="12" cy="12" rx="8" ry="3" /></svg><span>View</span></button>
        <button class="tool" data-tool="brush" title="Spectral brush (B). Shift = erase"><svg viewBox="0 0 24 24"><path d="M4 20c3 0 5-2 5-4.5S7 12 5.5 13 4 17 4 20z" /><path d="M9 15 20 4" /></svg><span>Brush</span></button>
        <button class="tool" data-tool="fork" title="Harmonic tuning fork (F). Shift-click = steady comb"><svg viewBox="0 0 24 24"><path d="M8 3v8a4 4 0 0 0 8 0V3" /><path d="M12 15v6" /></svg><span>Fork</span></button>
        <button class="tool" data-tool="knife" title="Band knife (K). Drag a box"><svg viewBox="0 0 24 24"><path d="M3 21 21 3" /><path d="M14 4l6 6-9 3z" /></svg><span>Knife</span></button>
        <button class="tool" data-tool="echo" title="Rhythm echo (E). Box one call, find its repeats"><svg viewBox="0 0 24 24"><path d="M4 12h2M9 7v10M14 9v6M19 6v12" /></svg><span>Echo</span></button>
        <div class="tool-sep"></div>
        <button class="tool small" id="btn-undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" /><path d="M4 9h10a6 6 0 0 1 0 12h-3" /></svg><span>Undo</span></button>
      </aside>

      <main id="stage" class="stage">
        <div id="canvas-wrap" class="canvas-wrap"></div>
        <div class="node-card" id="node-card"></div>
        <div class="tool-options" id="tool-options"></div>
        <div class="hint" id="hint"></div>
        <div class="transport">
          <button class="btn play" id="play-mix" title="Play mixture (Space)">&#9654; Mixture</button>
          <button class="btn play" id="play-layer" title="Play active layer (L)">&#9654; Layer</button>
          <button class="btn play" id="play-res" title="Play what is left (R)">&#9654; Residual</button>
          <button class="btn" id="stop">&#9632;</button>
          <span class="t-sep"></span>
          <label class="toggle" title="Subtract the per-frequency noise floor so faint calls stand out"><input type="checkbox" id="whiten" /> Whiten</label>
          <label class="slider" title="Lift separated layers apart in 3D">Unfold <input type="range" id="unfold" min="0" max="1" step="0.05" value="0" /></label>
          <span class="t-sep"></span>
          <button class="btn ghost" data-cam="perspective">3D</button>
          <button class="btn ghost" data-cam="top">Top</button>
          <button class="btn ghost" data-cam="side">Side</button>
        </div>
      </main>

      <aside class="panel" id="panel">
        <section id="brief" class="card"></section>
        <section class="card">
          <div class="card-head"><h3>Layers</h3><div id="add-layer" class="add-layer"></div></div>
          <ul id="layers" class="layers"></ul>
        </section>
        <section class="card">
          <div class="card-head"><h3>Separation score</h3><span class="muted small">SI-SDR, dB</span></div>
          <div id="scores"></div>
        </section>
        <section class="card">
          <div class="card-head"><h3>Classic DSP assist</h3></div>
          <div class="assist-row">
            <button class="btn" id="btn-hpss" title="Median-filter harmonic/percussive split. Sends rain-like percussive energy to a Rain layer.">Rain split (HPSS)</button>
            <button class="btn" id="btn-nmf" title="Non-negative matrix factorisation: proposes spectral 'strands' you can assign">Find strands (NMF)</button>
          </div>
          <div id="strands" class="strands"></div>
        </section>
        <section class="card contribute">
          <button class="btn primary wide" id="btn-contribute">Contribute separation to training set</button>
          <p class="muted small" id="contribute-note">Your masks become ground-truth labels for the edge model.</p>
        </section>
      </aside>
    </div>

    <div id="lab" class="drawer" hidden></div>
    <div id="eco" class="modal" hidden></div>
    <div id="intro" class="modal" hidden></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
