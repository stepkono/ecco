# BioSpectra configuration. Shared by bench/, device/ and backend/.

device:
  id: post-01
  location: Nuuksio wetland edge
  model_id: yamnet-tflite        # best few-shot accuracy on the board (ESC-50, see README). Must match the backend
  privacy_model_id: yamnet-tflite  # speech filter on the device (no TensorFlow). Same as model_id = one inference
  backend_url: ""                # Phase 2 backend, e.g. http://10.0.41.129:8000. Empty = offline
  sync_interval_s: 2             # upload clips / check prototypes this often
  hardware: auto                 # auto | mock | led | mock,led | none
  web_port: 8765                 # mock light page: http://<device>:8765
  decision_hop_s: 5.0            # one decision per this many seconds of audio

events:                          # how uncertain moments become puzzles (device/events.py)
  pre_roll_s: 2.0                # context saved before the first uncertain segment
  post_roll_s: 2.0               # and after the last one
  gap_tolerance: 0               # quiet/recognized segments allowed inside one event (0 = close at the first clear segment, so it arrives sooner)
  max_event_s: 15.0              # longer events are split. Shorter = it reaches the players sooner (a steady noise otherwise always fills 30 s)
  dedup_similarity: 0.90         # two 5 s segments are "the same sound" from this similarity (ESC-50: 67 % of
                                 # same-recording pairs, 0.0 % of different-sound pairs). Repeats are counted
  dedup_coverage: 0.8            # an event is a repeat only if this share of its 5 s segments has a twin
                                 # in one saved event. A single new sound inside a long event keeps it
  dedup_window_h: 24             # compare with events from this many hours back
  budget_per_hour: 60            # at most this many new events per hour. When full, a more novel event
                                 # replaces the least novel one

audio:
  sample_rate: 48000             # capture rate, resampled per model
  device: plughw:CARD=Camera,DEV=0  # ALSA name of the Arduino USB camera mic (arecord -L)
  mixer_card: Camera             # amixer card for the gain below
  mixer_control: Mic
  mic_gain_percent: 60           # 100 % clipped on loud sounds

runtime:
  threads: 4                     # CPU threads per model (UNO Q has 4 Cortex-A53 cores)
  clip_seconds: 5.0              # length of a saved uncertain clip
  hop_fraction: 1.0              # window hop as a fraction of the model window (1.0 = no overlap)

models:
  enabled: [yamnet, yamnet-tflite, birdnet-2.4, birdnet-2.4-int8, perch-2.0]
  cache_dir: data/models         # informational. Packages keep their own caches (see README)

gates:
  energy_dbfs: -55.0             # windows quieter than this RMS level count as silence
  privacy:
    model_id: yamnet             # YAMNet decides about speech. On the board use yamnet-tflite
    # Calibrated on TTS speech vs. frogs, cicada, chainsaw and rain (see README):
    # speech reaches ~1.0 in 4-5 windows, animals only spike in single windows.
    threshold: 0.5               # per-window combined speech score
    min_windows: 2               # windows at or above threshold needed to drop the clip
    hard_threshold: 0.8          # a single window this sure is enough on its own
    combine: max                 # max | sum over the speech classes
    classes:                     # names from the YAMNet class map
      - Speech
      - Child speech, kid speaking
      - Conversation
      - Narration, monologue
      - Babbling
      - Speech synthesizer
      - Shout
      - Whispering

head:
  type: prototype                # prototype | knn
  knn_k: 3
  t_known: 0.75                  # min cosine similarity to call a sound recognized (fallback)
  t_known_by_model:              # calibrated per model (python -m tools.calibrate_threshold)
    yamnet-tflite: 0.80          # tools.calibrate_threshold on ESC-50, 5-shot: 65 % known recognized, 88 % new sounds sent to players
    birdnet-2.4-int8: 0.40       # calibrated, but only 38 % known recognized: BirdNET embeddings suit birds, not this mix
  knob_range: [0.4, 0.95]        # trust knob 0..1 maps onto this T_known range
  t_noise: 0.65                  # lower bar to call something weather/noise: a missed gust costs nothing,
                                 # a false alarm costs player time. Animals keep the stricter T_known
  margin: 0.05                   # min gap between best and second-best class
  noise_label: noise             # label used by "Add as noise"

state:
  hold_seconds: 2.0              # keep a state at least this long so the light does not flicker

backend:                         # Phase 2 (backend/app.py), runs on the laptop
  host: 0.0.0.0
  port: 8000
  model_id: yamnet-tflite        # must equal device.model_id: prototypes are only valid for one model
  consensus_n: 2                 # agreeing reliable players needed to accept a label
  demo_mode: true                # demo: one label is enough (consensus_n = 1)
  min_reliability: 0.4           # players below this do not count towards consensus
  reliability_step: 0.2          # how fast gold answers move a player's reliability
  gold_rate: 0.2                 # share of puzzles that are hidden gold clips (when gold clips exist)
  labels: [frog, chirping_birds, crow, crickets]  # placeholder for the local target species (crickets = the new species in the pitch demo)
  posts:                         # where each listening post stands (shown on the challenge map)
    post-01: { name: Nuuksio wetland edge, region: "Espoo, Uusimaa", lat: 60.315, lon: 24.502 }
  spectrogram_max_rows: 192      # display grid sent to the game
  spectrogram_max_cols: 640

paths:
  data: data
  prototypes: data/prototypes
  queue: data/queue
  demo_set: data/demo_set
  bench_out: data/bench
  backend: data/backend
